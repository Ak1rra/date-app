# Local stack (NFR-QA-3): db, api, worker, web. `docker compose up`, then open
# http://localhost:8080. DEMO_MODE=1 by default, so no external keys are needed.
# Milestone 1 adds the api, worker and web services below the db.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dateapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dateapp}
      POSTGRES_DB: ${POSTGRES_DB:-dateapp}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dateapp} -d ${POSTGRES_DB:-dateapp}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
